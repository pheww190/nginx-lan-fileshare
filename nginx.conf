# ============================================================
#  LAN File Share - nginx.conf (Windows)
#  Browse, download, upload and delete files from a browser.
#  Access is protected by HTTP Basic Auth.
#
#  IMPORTANT (Windows nginx rules):
#   * Use FORWARD slashes in every path, e.g. C:/fileshare/data
#   * Paths here are absolute. If you keep files elsewhere,
#     change C:/fileshare/... below to match your layout.
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile            on;
    keepalive_timeout   65;

    # Uploads are staged here first, then moved into place.
    # Keep this on the SAME drive as C:/fileshare/data.
    client_body_temp_path   C:/fileshare/temp;

    server {
        listen       80;
        server_name  _;

        # ---------- Login (applies to everything below) ----------
        auth_basic           "LAN File Share";
        auth_basic_user_file C:/fileshare/conf/.htpasswd;

        # ---------- The web UI, served at http://<your-ip>/ ----------
        location = / {
            root   C:/fileshare/www;
            index  index.html;
        }

        # ---------- Shared folder: list / download / upload / delete ----------
        location /files/ {
            alias                 C:/fileshare/data/;

            autoindex             on;
            autoindex_format      json;    # the UI reads this to build the file list
            autoindex_exact_size  off;
            autoindex_localtime   on;

            # WebDAV write operations => upload (PUT), delete (DELETE), new folder (MKCOL)
            dav_methods           PUT DELETE MKCOL MOVE COPY;
            create_full_put_path  on;
            dav_access            user:rw group:rw all:r;

            client_max_body_size  0;       # 0 = no upload size limit

            # nobody can delete the /files/ root itself (needs >= 2 path parts)
            min_delete_depth      2;
        }

        # Any other path -> back to the UI
        location / {
            return 302 /;
        }
    }
}
